<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin • Mostra Pedagógica</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header">
      <div>
        <span class="eyebrow">PAINEL DA MOSTRA</span>
        <h1>Projetos</h1>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end">
        <span id="staffBadge" class="staff-badge"></span>
        <button id="logoutBtn" class="logout-btn" type="button">Sair</button>
        <a href="./" class="secondary-btn" style="width:auto;text-decoration:none">Abrir avaliação</a>
      </div>
    </header>

    <div id="modeNote" class="mode-note"></div>

    <div class="admin-grid">
      <section class="panel">
        <h2>Novo projeto</h2>
        <form id="projectForm">
          <label class="field"><span>Nome do projeto</span><input id="title" required maxlength="80" /></label>
          <label class="field"><span>Turma</span><input id="className" required maxlength="50" placeholder="Ex.: 4º Ano A" /></label>
          <label class="field"><span>Descrição</span><textarea id="description" maxlength="400" placeholder="Conte a ideia em poucas palavras..."></textarea></label>
          <div class="field photo-field">
            <span>Foto da maquete</span>
            <div class="photo-actions">
              <button id="cameraBtn" class="photo-action-btn photo-action-btn--camera" type="button">
                <span class="photo-action-icon">📷</span>
                <span>
                  <strong>Tirar foto</strong>
                  <small>Abrir câmera</small>
                </span>
              </button>
              <button id="uploadBtn" class="photo-action-btn" type="button">
                <span class="photo-action-icon">🖼️</span>
                <span>
                  <strong>Escolher imagem</strong>
                  <small>Galeria ou arquivos</small>
                </span>
              </button>
            </div>
            <input id="cameraInput" class="hidden-file-input" type="file" accept="image/*" capture="environment" />
            <input id="uploadInput" class="hidden-file-input" type="file" accept="image/*" />
            <div id="photoPreviewWrap" class="photo-preview-wrap hidden">
              <img id="photoPreview" class="photo-preview" alt="Prévia da foto da maquete" />
              <div class="photo-preview-info">
                <strong id="photoFileName">Imagem selecionada</strong>
                <button id="removePhotoBtn" class="photo-remove-btn" type="button">Remover</button>
              </div>
            </div>
          </div>
          <button class="primary-btn" type="submit">Cadastrar projeto</button>
        </form>
      </section>

      <section class="panel">
        <h2>Projetos cadastrados</h2>
        <div id="projectList" class="admin-list"></div>
      </section>
    </div>
  </main>
  <script src="./config.js"></script>
  <script type="module" src="./admin.js"></script>
</body>
</html>
